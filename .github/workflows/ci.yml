name: CI

# Runs on every push to main, on pull requests, and on demand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  host-tests:
    name: Host tests and documentation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the signing tool's dependency
        run: python -m pip install cryptography

      - name: Bootloader host tests (SHA-256, ECDSA, image, anti-rollback, update, option bytes)
        run: make -C bootloader/test test

      - name: Secure-link host tests (AES, CMAC, packets, frame counter)
        run: make -C secure_link/test test

      - name: Documentation and consistency tests
        run: python -m unittest discover -s tests -v
